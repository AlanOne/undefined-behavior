baseURL = "https://AlanOne.github.io/omarchy-notes/"
languageCode = "en-us"
locale = "en-US"
title = "Omarchy Notes"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true

[params]
  env = "production"
  description = "Practical guides for Omarchy, Hyprland, self-hosting, and Linux dev tooling — written by someone who actually runs this stuff daily."
  author = "Alan"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  comments = false

  [params.homeInfoParams]
    Title = "Omarchy Notes"
    Content = "Practical, no-fluff guides for running Omarchy, Hyprland, and a self-hosted Linux setup — written from actually doing it, not from a press release."

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "start-here"
  name = "Start Here"
  url = "/posts/start-here/"
  weight = 20

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false
