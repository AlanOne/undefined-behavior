baseURL = "https://AlanOne.github.io/undefined-behavior/"
languageCode = "en-us"
locale = "en-US"
title = "Undefined Behavior"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true

[params]
  env = "production"
  description = "Practical, tested notes on Linux, Windows, gaming, self-hosting, and programming — written by someone who actually runs this stuff daily, not from a press release."
  author = "Alan"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  comments = false

  [params.homeInfoParams]
    Title = "Undefined Behavior"
    Content = "What happens when you push a system past what it's supposed to do. Notes on Linux, Windows, gaming, self-hosting, and programming — written from actually doing it, not from a press release."

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/AlanOne"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "categories"
  name = "Categories"
  url = "/categories/"
  weight = 20

[[menu.main]]
  identifier = "start-here"
  name = "Start Here"
  url = "/posts/start-here/"
  weight = 30

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 40

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false
